name: touchBarText
options:
  bundleIdPrefix: com.maxim
  createIntermediateGroups: true
targets:
  touchBarText:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: touchBarText
        excludes:
          - "Info.plist"
    info:
      path: touchBarText/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_NAME: touchBarText
        PRODUCT_BUNDLE_IDENTIFIER: com.maxim.touchBarText
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: touchBarText/touchBarText-Bridging-Header.h
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
